[project]
name = "blc-inaspeech"
version = "0.1.0"
description = "BiliLiveCut inaSpeechSegmenter 旁路音频分类插件与独立推理服务"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
runtime = [
  "inaSpeechSegmenter==0.8.0; sys_platform == 'linux'",
  "tensorflow==2.21.0; sys_platform == 'linux'",
]

[project.scripts]
blc-inaspeech = "blc_inaspeech.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0,<10", "pytest-timeout>=2.4,<3", "pytest-cov>=7,<8",
  "ruff==0.16.10", "mypy>=1.19,<2", "build>=1.3,<2",
  "pip-audit>=2.9,<3", "pydantic>=2.7,<3", "sqlmodel>=0.0.22,<0.0.45",
  "loguru>=0.7,<1", "httpx>=0.28,<1", "pydantic-settings>=2.3,<3",
  "psutil>=7.2,<8", "numpy>=2.2,<3", "pyyaml>=6,<7", "websockets>=12",
  "brotli>=1.1", "rich>=13.7", "typer>=0.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blc_inaspeech = ["models.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D400", "D415", "D403", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/blc_inaspeech", "scripts"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["app.*", "tensorflow.*", "inaSpeechSegmenter.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 45
markers = ["runtime: requires the separately installed real inaSpeechSegmenter runtime"]
